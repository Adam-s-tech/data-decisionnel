<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540" role="img" aria-label="Capture fictive d'un tableau de bord">
  <rect width="1100" height="540" fill="#F6F7FB"/>
  <rect x="40" y="30" width="1020" height="60" rx="10" fill="#2D3561"/>
  <text x="70" y="68" font-family="Arial" font-size="24" fill="#FFFFFF" font-weight="bold">Tableau de bord · démo fictive</text>
  <rect x="60" y="120" width="300" height="100" rx="10" fill="#FFFFFF" stroke="#D9DCE8"/>
  <text x="85" y="150" font-family="Arial" font-size="16" fill="#666">Chiffre d'affaires</text>
  <text x="85" y="195" font-family="Arial" font-size="34" fill="#2D3561" font-weight="bold">1,2 M€</text>
